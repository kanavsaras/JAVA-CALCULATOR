<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot Calculator</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f7f6; }
        .calc-card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 1rem; }
        input, select, button { padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 5px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; width: 100%; }
        button:hover { background: #0056b3; }
        #result-display { margin-top: 1.5rem; text-align: center; color: #333; }
    </style>
</head>
<body>

    <div class="calc-card">
        <h2>Java Web Calculator</h2>
        
        <div class="input-group">
            <input type="number" id="num1" placeholder="Number 1">
            <select id="operation">
                <option value="add">+</option>
                <option value="subtract">-</option>
                <option value="multiply">×</option>
                <option value="divide">÷</option>
                <option value="mod">%</option>
            </select>
            <input type="number" id="num2" placeholder="Number 2">
        </div>

        <button id="calcBtn">Calculate</button>

        <div id="result-display">
            <h3>Result: <span id="answer">?</span></h3>
        </div>
    </div>

    <script>
        document.getElementById('calcBtn').addEventListener('click',async()=> {
    const n1 = document.getElementById('num1').value;
    const n2 = document.getElementById('num2').value;
    const op = document.getElementById('operation').value;
    const response = await fetch('/calculate',{
        method : "POST",
        headers: {'Content-Type':'application/json'},
        body:JSON.stringify({num1:n1,
            num2:n2,
            operation:op})
    })
const data = await response.json();
document.getElementById('answer').innerText = data;



    
});
    </script>
</body>
</html>
